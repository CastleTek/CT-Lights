<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta content='width=device-width' name='viewport'>
		<meta name="theme-color" content="#222222">
		<title>Welcome!</title>
		<style>
			body {
				font-family: Verdana, Helvetica, sans-serif;
				text-align: center;
				background-color: #222;
				margin: 0;
				color: #fff;
			}
	
			button {
				outline: none;
				cursor: pointer;
				padding: 8px;
				margin: 10px;
				width: 230px;
				text-transform: uppercase;
				font-family: helvetica;
				font-size: 19px;
				background-color: #333;
				color: white;
				border: 0px solid white;
				border-radius: 25px;
			}

			img {
				width: 950px;
				max-width: 82%;
				image-rendering: pixelated;
				image-rendering: crisp-edges;
				margin: 4vh 0 0 0;
				animation: fi 1s;
			}
			
			@keyframes fi {
				from { opacity: 0; }
				to   { opacity: 1; }
			}
	
			.main {
				animation: fi 1.5s .7s both;
			}
		</style>
	</head>
	<body>
		<img id="wledMark" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAG0AAAAfCAMAAADazLOuAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAABLUExURQAAAAB81gCU/zKq///mo7sWMN8bO+ZIYtZaAP9rAP+HMsCiG+TAIOnMS0KqNU7KPnLUZOrq6v///4CAgGhoaL+/v6CgoExMTAAAAAlm4O8AAAAZdFJOU////////////////////////////////wABNAq3AAAACXBIWXMAAA7DAAAOwwHHb6hkAAACN0lEQVRIS73VjVLCMBAEYIr8CYKkrdj3f1J37zaXFCpTO+piaDgbPq9px9VQ0qyrvKj4q6m0Zr1h+M7xF1zRmnWzqV9/0d2jttGotO1uv9dUObwej5oqp7fzWVPl8n69aprzoOUUbbvdIbV3OLwitXc6vSG1d7m8I3feSEN0j2CeNbOY4MxigjOLCc4sZsTV2l1cCyy4wIILLLjAxtykltq2rbTU+qi01N5rXNO2leaFORoija2l5MM5a02ac9Ya16Sk5tgaPrUpjZub0BL6YqSxKwbH77XUUmSkJXSl8QtaMuyJhq5maL5nTKVpZC13VmtMpTFT2g4vJjTuGfMzzXftiUZnhdtgb1xofvypRon5TjNnxYN9zJo6K5ruSIzQtGuVZn0x91rKvdHBvm39E7SyZ4y06Gz8BDBFKzsXmhcwyfsGZ9VpbhoiCinaxPNmGWmWWrNU2jB0q6HvOhN1JUtCixQtp2g51ZVUXIPS2RMAD++T2nY/DrDjOMDO4wC7jmNYj3d73nrXug8Yt9uNB8xNU1cKNXWlUFNXCjV1pZhGTE83m2vWfYf/NGj4Bg1zu5JD3/MnH5ZWfLOksbmGWGjgXMN5/C2GXYGFFW9Nmtle6Xut0Gm+JsayCj8z0nhjGvYJzVf4aSzmNYsr+u7Q2JIdoX3YOQjOslmsW1jJ3120nE9gfo79hTaNdcsqVR610lvO47pllae9ReZ805zKo2a3iaY5c75pTmVCA6dJ5H7N0sr/asPwBehb7ifEhusRAAAAAElFTkSuQmCC">
		<svg id="castleTekMark" aria-label="CastleTek" role="img" viewBox="0 0 64 64" style="display:none;width:112px;margin-top:5vh">
			<rect width="64" height="64" rx="14" fill="#101827"/><path d="M12 49V27h8v-8h8v8h8v-8h8v8h8v22H38V38H26v11z" fill="#ffb547"/><path d="M8 52h48v4H8z" fill="#59d8ff"/>
		</svg>
		<div class="main">
			<h1 id="welcomeTitle">Welcome to WLED!</h1>
			<h3 id="welcomeSubtitle">A versatile tool for controlling LEDs</h3>
			<h4 id="welcomeLink">Find out more at wled.me</h4>
			<b>Next steps:</b><br><br>
			Connect to your local WiFi here!<br>
			<button onclick="window.location.href='./settings/wifi'">WiFi settings</button><br>
			<i>Just trying this out in AP mode?</i><br>
			<button id="controlsButton" onclick="window.location.href='./?sliders'">To the controls!</button><br>
		</div>
		<script>
				const ns = "/castletek/v1";
				const path = window.location.pathname;
				const authenticated = "/api/castletek/v1";
				const candidateIndex = path.indexOf(ns);
				const prefix = candidateIndex >= 0 ? path.slice(0, candidateIndex) : "";
				const isAuthenticated = path === authenticated || path.startsWith(authenticated + "/") || prefix === "/api" || prefix.endsWith("/api");
				const nsEnd = candidateIndex + ns.length;
				if (candidateIndex >= 0 && !isAuthenticated && (nsEnd === path.length || path.charAt(nsEnd) === "/")) {
				document.getElementById("wledMark").style.display = "none";
				document.getElementById("castleTekMark").style.display = "inline-block";
				document.getElementById("welcomeTitle").textContent = "Welcome to CastleTek!";
				document.getElementById("welcomeSubtitle").textContent = "Seasonal lighting powered by the WLED 0.16 engine";
				document.getElementById("welcomeLink").style.display = "none";
				document.getElementById("controlsButton").onclick = () => window.location.href = "./";
			}
		</script>
	</body>
</html>
