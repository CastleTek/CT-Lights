name: CT-Lights DigQuad Release CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ct-lights-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host-tests:
    name: Host and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CXX: clang++
      SOURCE_DATE_EPOCH: '1790899200'
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4
      - name: Install pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install Python build runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify approved source bytes
        run: python tools/castletek-release-bundle.py verify
      - name: Install locked browser dependencies
        run: npm ci
      - name: Regenerate browser assets
        run: npm run build -- --force
      - name: Run host and browser regression tests
        run: npm test -- --test-concurrency=1
      - name: Verify approved source bytes
        run: python tools/castletek-release-bundle.py verify
  digquad-release:
    name: DigQuad firmware and matching source
    needs: host-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4
      - name: Install pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install Python build runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build only DigQuad from the corresponding-source archive
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CI_RUN: ${{ github.run_id }}
        run: python tools/castletek-release-bundle.py build --output build_output/public-release --commit "$SOURCE_COMMIT" --ci-run "$CI_RUN"
      - name: Retain matching release candidate
        uses: actions/upload-artifact@v4
        with:
          name: CT-Lights-release-${{ github.sha }}
          path: |
            build_output/public-release/*.zip
            build_output/public-release/*.bin
            build_output/public-release/*.ctfw
            build_output/public-release/*.json
            build_output/public-release/*.txt
            build_output/public-release/*.md
            build_output/public-release/LICENSE
          if-no-files-found: error
          retention-days: 90
