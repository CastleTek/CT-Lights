[platformio]
default_envs = castletek_compat_esp32dev, castletek_compat_digquad_v2_v3_wifi

[castletek_compat]
build_flags =
  ${common.build_flags}
  ${esp32_idf_V4.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D CASTLETEK_WLED_COMPAT
  -D WLED_REPO=\"unknown\"
  -D WLED_BRAND=\"CastleTek\"
  -D WLED_PRODUCT_NAME=\"CastleTek_WLED_Compatibility_v1\"
  -D WLED_AP_SSID=\"CastleTek-Setup\"
  -D WLED_AP_PASS=\"castletek\"
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_PIXELFORGE

[env:castletek_compat_esp32dev]
extends = env:esp32dev
build_flags =
  ${castletek_compat.build_flags}
  -D WLED_RELEASE_NAME=\"CastleTek_WLED_Compat_ESP32\"
  ; Keep the generic board's USB UART pins (GPIO1/3) available.
  -D DATA_PINS=16,17,18,19

[env:castletek_compat_digquad_v2_v3_wifi]
extends = env:esp32dev
; Release-specific dependencies are immutable; generic/stock profiles retain upstream policy.
lib_deps =
  esp32async/AsyncTCP @ 3.4.7
  bitbank2/AnimatedGIF @ 1.4.7
  https://github.com/Aircoookie/GifDecoder.git#bc3af189b6b1e06946569f6b4287f0b79a860f8e
  https://github.com/someweisguy/esp_dmx.git#47db25d8c515e76fabcf5fc5ab0b786f98eeade0
  crankyoldgit/IRremoteESP8266 @ 2.8.2
  https://github.com/Makuna/NeoPixelBus.git#a0919d1c10696614625978dd6fb750a1317a14ce
  https://github.com/Aircoookie/ESPAsyncWebServer.git#39b830c852054444ea12a8b5d7fcb4fa004a89d7
  marvinroger/AsyncMqttClient @ 0.9.0
  https://github.com/blazoncek/QuickESPNow.git#193e991642cbffe1d44e7445a0a34445f69a67d8
build_flags =
  ${castletek_compat.build_flags}
  -D WLED_RELEASE_NAME=\"CastleTek_WLED_Compat_DigQuad_v2v3\"
  -D DATA_PINS=16,3,1,4
  -D CASTLETEK_WLED_FIXED_RELAY_PIN=15

; Compile the shared WLED path for the same Dig-Quad pins without Compatibility.
; This is a CI regression target, not a CastleTek app update package.
[env:castletek_wled_digquad_regression]
extends = env:esp32dev
build_flags =
  ${common.build_flags}
  ${esp32_idf_V4.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D WLED_RELEASE_NAME=\"WLED_DigQuad_v2v3_Regression\"
  -D DATA_PINS=16,3,1,4
